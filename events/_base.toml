# Shared glossary for every event: AWS, Anthropic and common AI terms.
# An event file adds people, agenda and terms (general.toml for defaults, example.toml for a fictional event).
#
# [[terms]]
#   en        how the term is written in English subtitles (also the en-US vocabulary phrase)
#   ko        how it is written in Korean subtitles (default: same as en, i.e. kept in English)
#   say_ko    how Korean speakers pronounce it, for the ko-KR vocabulary and KO→EN fixes
#   always    speech-recognition errors or Korean abbreviations (삼전) that are certainly this term: replaced before
#             translation and on screen (Hangul ones by the first say_ko form)
#   heard_as  errors that could also be real words ("cloud"): only a hint to the translator, which decides from context
#   note      one line for the translator model

[[terms]]
en = "Anthropic"
say_ko = ["앤트로픽", "앤쓰로픽"]
always = ["anthropics", "엔트로픽"]
heard_as = ["entropy", "엔트로피"]

[[terms]]
en = "Claude"
say_ko = ["클로드"]
heard_as = ["cloud", "clawed", "clod", "clode", "claud", "coud"]
note = "Anthropic's model family. When the context is AI models or agents, 'cloud' almost always means Claude."

