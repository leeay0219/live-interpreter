# Generic AI / cloud / IT concept terms, written the way AWS Korea and the Korean tech press write them.
# Terms already in events/_base.toml (agent, agentic, foundation model, PoC, use case, ...) are not repeated here.
# Fields: en, ko, say_ko (Hangul only), heard_as (possible English mishearings), note, source.

